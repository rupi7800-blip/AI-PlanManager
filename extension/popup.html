<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>AI Plan Manager</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.45 system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; background: Canvas; color: CanvasText; }
  h1 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  .s { padding: 7px 0; border-top: 1px solid rgba(128,128,128,.25); }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .muted { opacity: .65; }
  button { font: inherit; padding: 5px 10px; border-radius: 7px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; cursor: pointer; margin-top: 6px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
</style></head>
<body>
  <h1><img src="icons/icon-32.png" width="18" height="18" alt="">AI Plan Manager</h1>
  <div id="list" class="muted">Caricamento…</div>
  <div id="hidden"></div>
  <button id="open">Apri l'app</button>
  <p class="muted">La finestrella appare sulle pagine delle AI configurate. I dati arrivano dall'app quando è aperta.</p>
  <script src="popup.js"></script>
</body></html>
